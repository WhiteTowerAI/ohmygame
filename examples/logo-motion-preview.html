<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OhMyGame Logo Motion</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0d0f11; color: #f4f5f6; }
    main { display: grid; justify-items: center; gap: 28px; padding: 32px; }
    .logo { display: block; width: min(280px, calc(100vw - 64px)); aspect-ratio: 1; line-height: 0; user-select: none; }
    .logo svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .controls { display: flex; max-width: min(680px, calc(100vw - 32px)); flex-wrap: wrap; justify-content: center; gap: 6px; }
    button { padding: 6px 9px; border: 1px solid #30343a; border-radius: 5px; background: transparent; color: #a8adb5; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover, button[aria-pressed="true"] { border-color: #555b64; background: #191c20; color: #f4f5f6; }
    .mark, .face, .eyes, .eye, .mouth { transform-box: view-box; transform-origin: 140px 140px; }
    .ribbons, .confetti, .sleep-indicator { opacity: 0; }
    .ribbon { stroke-width: 7; }
    .state-idle .mark { animation: breathe 3.6s ease-in-out infinite; }
    .state-idle .eyes { animation: idle-look 4.8s ease-in-out infinite; }
    .state-thinking .mark { animation: think 3.6s ease-in-out infinite; }
    .state-thinking .eyes { animation: think-look 2.6s ease-in-out infinite; }
    .state-thinking .ribbons { opacity: 0.92; }
    .state-thinking .ribbon { stroke-dasharray: 54 360; animation: ribbon-travel 2.6s linear infinite; }
    .state-thinking .ribbon-b, .state-thinking .ribbon-e { animation-delay: -0.9s; }
    .state-thinking .ribbon-c, .state-thinking .ribbon-f { animation-delay: -1.7s; }
    .state-working .mark, .state-waiting .mark { animation: breathe 3.6s ease-in-out infinite; }
    .state-working .eyes { animation: work-look 1.2s ease-in-out infinite; }
    .state-waiting .eyes { animation: wait-look 2.2s ease-in-out infinite; }
    .is-hovered .mark { animation: curious-tilt 2.8s ease-in-out infinite; }
    .is-hovered .eyes { animation: curious-look 2.1s ease-in-out infinite; }
    .state-error .mark { animation: error-shake 800ms ease-out both; }
    .state-error .body { animation: error-flash 800ms steps(1, end) both; }
    .state-error .eye-left { transform: translate(-1px, -3px) rotate(-6deg); }
    .state-error .eye-right { transform: translate(1px, 4px) rotate(8deg); }
    .state-completed .mark { animation: complete-hop 1.1s ease-out both; }
    .state-completed .confetti { fill: none; stroke: #f5b13f; stroke-width: 6; stroke-linecap: round; animation: confetti 1.1s ease-out both; }
    .state-completed .ribbons { animation: ribbon-burst 1.1s ease-out both; }
    .state-completed .ribbon { stroke-width: 8; stroke-dasharray: 90 30; }
    .state-sleeping .mark { animation: sleep-breathe 4.2s ease-in-out infinite; }
    .state-sleeping .eye { transform: translateY(5px) scaleY(0.08); }
    .state-sleeping .sleep-indicator { fill: #a8a296; font: 700 italic 20px/1 sans-serif; animation: sleep-z 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-0.7px) scale(1.008); } }
    @keyframes idle-look { 0%, 18%, 82%, 100% { transform: translate(0); } 30%, 44% { transform: translateX(-3px); } 56%, 70% { transform: translateX(3px); } }
    @keyframes think { 0%, 100% { transform: translateY(0) rotate(-3deg) scale(1); } 50% { transform: translateY(-0.6px) rotate(-3deg) scale(1.007); } }
    @keyframes think-look { 0%, 100% { transform: translate(-4px, -4px); } 50% { transform: translate(4px, -4px); } }
    @keyframes ribbon-travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -414; } }
    @keyframes work-look { 0%, 100% { transform: translate(0); } 25% { transform: translate(2px, -1.5px); } 50% { transform: translate(0, 1.5px); } 75% { transform: translate(-2px, -1.5px); } }
    @keyframes wait-look { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
    @keyframes curious-tilt { 0%, 100% { transform: rotate(3deg) scale(1); } 50% { transform: translateY(-1px) rotate(4deg) scale(1.008); } }
    @keyframes curious-look { 0%, 100% { transform: translate(-1px, -1px); } 50% { transform: translate(2px, -1px); } }
    @keyframes error-shake { 0% { transform: translateX(0) rotate(0); } 16% { transform: translateX(-5px) rotate(-4deg); } 34% { transform: translateX(4px) rotate(2deg); } 52% { transform: translateX(-3px) rotate(-5deg); } 72% { transform: translateX(2px) rotate(-4deg); } 100% { transform: translateX(0) rotate(-6deg); } }
    @keyframes error-flash { 0%, 40% { fill: #e25b5b; } 20%, 62% { fill: #f6f3ec; } 100% { fill: #de5555; } }
    @keyframes complete-hop { 0%, 100% { transform: translateY(0) scale(1); } 28% { transform: translateY(-6px) scale(1.025); } 64% { transform: translateY(-2px) scale(1.012); } }
    @keyframes confetti { 0% { opacity: 0; transform: translateY(8px) scale(0.7); } 24% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px) scale(1.08); } }
    @keyframes ribbon-burst { 0% { opacity: 0; stroke-dashoffset: 120; transform: scale(0.78); } 20%, 68% { opacity: 0.9; } 100% { opacity: 0; stroke-dashoffset: -80; transform: scale(1.06); } }
    @keyframes sleep-breathe { 0%, 100% { transform: translateY(4px) rotate(-2deg) scale(0.992); } 50% { transform: translateY(3px) rotate(-2deg) scale(1.006); } }
    @keyframes sleep-z { 0%, 100% { opacity: 0.18; transform: translateY(3px); } 50% { opacity: 0.72; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .mark, .eyes, .ribbons, .confetti, .sleep-indicator, .body { animation: none !important; } .state-error .body { fill: #de5555; } }
  </style>
</head>
<body>

      </svg>
    </span>
    <div class="controls" role="group" aria-label="Logo states"></div>
  </main>
  <script>
    const states = ["idle", "thinking", "working", "waiting", "error", "completed", "sleeping"];
    const logo = document.querySelector(".logo");
    const controls = document.querySelector(".controls");
    let state = "idle";
    function select(next) {
      state = next;
      logo.className = `logo state-${state}`;
      logo.dataset.state = state;
      logo.querySelector("svg").setAttribute("aria-label", `OhMyGame ${state}`);
      controls.querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.state === state)));
    }
    states.forEach((name) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name;
      button.dataset.state = name;
      button.addEventListener("click", () => select(name));
      controls.append(button);
    });
    logo.addEventListener("pointerenter", () => { if (state === "idle") logo.classList.add("is-hovered"); });
    logo.addEventListener("pointerleave", () => logo.classList.remove("is-hovered"));
    select("idle");
  </script>
</body>
</html>
