name: Set up platform checks
description: Install Node, Bun and dependencies, then prepare the preinstalled plugins.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.19.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    # Keep Bun's store on the workspace volume so it can link packages on Windows
    # instead of copying them across drives. Restoring the store from the Actions
    # cache took longer than a fresh install on both platforms, so it is not cached.
    - shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=${{ runner.temp }}/bun-store" >> "$GITHUB_ENV"
    - shell: bash
      run: bun install --frozen-lockfile
    - shell: bash
      run: bun run prepare:preinstalled-plugins
