name: Set up platform checks
description: Install Node, Bun and dependencies with a cached Bun store, then prepare the preinstalled plugins.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.19.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    # Keep the store on the workspace volume so Bun can link packages from it on Windows.
    - shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=${{ runner.temp }}/bun-cache" >> "$GITHUB_ENV"
    - id: bun-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/bun-cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml', 'patches/**') }}
    - shell: bash
      run: bun install --frozen-lockfile
    # Save before the checks so a failing test still warms the cache.
    - if: steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/bun-cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
    - shell: bash
      run: bun run prepare:preinstalled-plugins
