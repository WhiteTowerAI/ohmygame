name: Set up platform checks
description: Install Node, Bun and dependencies, then prepare the preinstalled plugins.

inputs:
  seed-windows-dependencies:
    description: Save a fresh Windows install for subsequent CI jobs.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.19.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    # Cache the installed tree before any tests or builds can write to it.
    - name: Restore Windows dependencies
      if: runner.os == 'Windows'
      id: dependencies
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/windows-modules
        key: windows-modules-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-platform/*', 'package.json', 'bun.lock', 'bunfig.toml', 'patches/**') }}
    - name: Extract Windows dependencies
      id: extract
      continue-on-error: true
      if: steps.dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit == 'true'
      shell: pwsh
      run: '& "$env:GITHUB_ACTION_PATH/windows-modules.ps1"'
    - name: Discard partially extracted Windows dependencies
      if: steps.extract.outcome == 'failure'
      shell: pwsh
      run: node -e "require('node:fs').rmSync('node_modules', { recursive:true, force:true, maxRetries:3 })"
    # On a miss, keep Bun's store on the workspace volume for hardlinks.
    - shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=${{ runner.temp }}/bun-store" >> "$GITHUB_ENV"
    # Run after an extract too: the archive loses the workspace links under
    # node_modules (such as @ohmygame/sdk), and this puts them back.
    - shell: bash
      run: bun install --frozen-lockfile
    - name: Pack Windows dependencies
      if: runner.os == 'Windows' && inputs.seed-windows-dependencies == 'true' && steps.dependencies.outputs.cache-hit != 'true'
      id: pack
      continue-on-error: true
      shell: pwsh
      run: '& "$env:GITHUB_ACTION_PATH/windows-modules.ps1" -Pack'
    - name: Save Windows dependencies
      if: steps.pack.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/windows-modules
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
    - shell: bash
      run: bun run prepare:preinstalled-plugins
