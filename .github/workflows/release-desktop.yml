name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:desktop-runtime win32-x64
        env:
          PUBLISH_API_URL: ${{ vars.PUBLISH_API_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      # Fail the release instead of shipping without examples; the build step reuses this output.
      - run: bun run prepare:examples --require
      - run: bun run build:desktop-app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - name: Validate desktop release configuration
        shell: pwsh
        run: |
          if (-not $env:DESKTOP_UPDATE_URL) { throw "DESKTOP_UPDATE_URL repository variable is not configured" }
      - name: Build Windows package
        run: bun --bun node_modules/electron-builder/cli.js --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyGame-Windows-x64
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  macos:
    runs-on: macos-14
    env:
      DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:desktop-runtime darwin-arm64
        env:
          PUBLISH_API_URL: ${{ vars.PUBLISH_API_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      # Fail the release instead of shipping without examples; the build step reuses this output.
      - run: bun run prepare:examples --require
      - run: bun run build:desktop-app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - name: Validate Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$DESKTOP_UPDATE_URL" ]; then
            echo "::error::DESKTOP_UPDATE_URL repository variable is not configured"
            exit 1
          fi
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
      - name: Build signed macOS package
        run: bun --bun node_modules/electron-builder/cli.js --mac dmg zip --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyGame-macOS-arm64
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release:
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OhMyGame-*
          path: release-assets
          merge-multiple: true
      - name: Validate update publishing configuration
        env:
          DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_DESKTOP_UPDATE_PREFIX: ${{ vars.R2_DESKTOP_UPDATE_PREFIX }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for name in DESKTOP_UPDATE_URL R2_ACCOUNT_ID R2_BUCKET R2_DESKTOP_UPDATE_PREFIX R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          case "$R2_DESKTOP_UPDATE_PREFIX" in
            /*|*/)
              echo "::error::R2_DESKTOP_UPDATE_PREFIX must not start or end with a slash"
              exit 1
              ;;
          esac
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
      - name: Upload immutable update packages to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_DESKTOP_UPDATE_PREFIX: ${{ vars.R2_DESKTOP_UPDATE_PREFIX }}
        run: |
          aws s3 cp release-assets "s3://$R2_BUCKET/$R2_DESKTOP_UPDATE_PREFIX/" \
            --recursive \
            --exclude "*.yml" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --no-progress
      - name: Publish update manifests to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_DESKTOP_UPDATE_PREFIX: ${{ vars.R2_DESKTOP_UPDATE_PREFIX }}
        run: |
          for manifest in release-assets/latest.yml release-assets/latest-mac.yml; do
            aws s3 cp "$manifest" "s3://$R2_BUCKET/$R2_DESKTOP_UPDATE_PREFIX/$(basename "$manifest")" \
              --content-type "application/x-yaml" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --no-progress
          done
      - name: Verify public update feed
        env:
          DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
        run: |
          curl --fail --silent --show-error "$DESKTOP_UPDATE_URL/latest.yml" >/dev/null
          curl --fail --silent --show-error "$DESKTOP_UPDATE_URL/latest-mac.yml" >/dev/null
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh needs to be told the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-assets/*.exe \
              release-assets/*.dmg \
              release-assets/*.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/*.exe \
              release-assets/*.dmg \
              release-assets/*.zip \
              --verify-tag \
              --title "OhMyGame $GITHUB_REF_NAME" \
              --prerelease \
              --generate-notes
          fi
      - name: Delete intermediate GitHub artifacts
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].id' \
            | while read -r artifact_id; do
                gh api --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done
