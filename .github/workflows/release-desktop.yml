name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:desktop-runtime -- win32-x64
        env:
          PUBLISH_API_URL: ${{ vars.PUBLISH_API_URL }}
      - run: npm run build:desktop-app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Validate desktop release configuration
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:DESKTOP_UPDATE_URL) { throw "DESKTOP_UPDATE_URL repository variable is not configured" }
          if (-not $env:WINDOWS_CSC_LINK) { throw "WINDOWS_CSC_LINK repository secret is not configured" }
          if (-not $env:WINDOWS_CSC_KEY_PASSWORD) { throw "WINDOWS_CSC_KEY_PASSWORD repository secret is not configured" }
      - name: Build signed Windows package
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyGame-Windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  macos:
    runs-on: macos-14
    env:
      DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:desktop-runtime -- darwin-arm64
        env:
          PUBLISH_API_URL: ${{ vars.PUBLISH_API_URL }}
      - run: npm run build:desktop-app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Validate Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$DESKTOP_UPDATE_URL" ]; then
            echo "::error::DESKTOP_UPDATE_URL repository variable is not configured"
            exit 1
          fi
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
      - name: Build signed macOS package
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyGame-macOS-arm64
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release:
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OhMyGame-*
          path: release-assets
          merge-multiple: true
      - name: Validate update publishing configuration
        env:
          DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_DESKTOP_UPDATE_PREFIX: ${{ vars.R2_DESKTOP_UPDATE_PREFIX }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for name in DESKTOP_UPDATE_URL R2_ACCOUNT_ID R2_BUCKET R2_DESKTOP_UPDATE_PREFIX R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          case "$R2_DESKTOP_UPDATE_PREFIX" in
            /*|*/)
              echo "::error::R2_DESKTOP_UPDATE_PREFIX must not start or end with a slash"
              exit 1
              ;;
          esac
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
      - name: Upload immutable update packages to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_DESKTOP_UPDATE_PREFIX: ${{ vars.R2_DESKTOP_UPDATE_PREFIX }}
        run: |
          aws s3 cp release-assets "s3://$R2_BUCKET/$R2_DESKTOP_UPDATE_PREFIX/" \
            --recursive \
            --exclude "*.yml" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --no-progress
      - name: Publish update manifests to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_DESKTOP_UPDATE_PREFIX: ${{ vars.R2_DESKTOP_UPDATE_PREFIX }}
        run: |
          for manifest in release-assets/latest.yml release-assets/latest-mac.yml; do
            aws s3 cp "$manifest" "s3://$R2_BUCKET/$R2_DESKTOP_UPDATE_PREFIX/$(basename "$manifest")" \
              --content-type "application/x-yaml" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --no-progress
          done
      - name: Verify public update feed
        env:
          DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
        run: |
          curl --fail --silent --show-error "$DESKTOP_UPDATE_URL/latest.yml" >/dev/null
          curl --fail --silent --show-error "$DESKTOP_UPDATE_URL/latest-mac.yml" >/dev/null
