name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run changelog:check
      - run: bun run prepare:preinstalled-plugins
      - run: bun run typecheck
      - run: bun run test:ablation --dry-run
      - run: bun run test
      - run: bun run build:renderer
      - run: bun run test:node-runtime

  # The suite takes about twice as long on macOS and Windows, so it runs in shards there.
  platform-tests:
    name: platform-tests (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, shard: 1 }
          - { os: macos-15, shard: 2 }
          - { os: windows-latest, shard: 1 }
          - { os: windows-latest, shard: 2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-platform
      - run: bun run test -- --shard=${{ matrix.shard }}/2

  platform-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-platform
      - run: bun run typecheck
      - run: bun run test:node-runtime
