name: Release Windows desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:desktop-runtime -- win32-x64
      - run: npm run build:desktop-app
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGame-Windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/alpha.yml
