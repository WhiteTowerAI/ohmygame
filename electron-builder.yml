appId: ai.ohmygame.desktop
productName: OhMyGame
asar: true
asarUnpack:
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*

directories:
  output: release

files:
  - dist/desktop/**/*.js
  - dist/desktop/**/*.cjs
  - dist/daemon/**/*.js
  - dist/shared/**/*.js
  - dist/renderer/**/*
  - dist/player/**/*

extraResources:
  - from: plugins
    to: plugins
  - from: .runtime/preinstalled-plugins
    to: preinstalled-plugins
  - from: .runtime/examples
    to: examples
  - from: .runtime/node
    to: runtime/node
  - from: .runtime/desktop-config.json
    to: desktop-config.json

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: OhMyGame-${version}-${arch}.${ext}

publish:
  provider: generic
  url: ${env.DESKTOP_UPDATE_URL}
  channel: latest

dmg:
  artifactName: OhMyGame-${version}-${arch}.${ext}
