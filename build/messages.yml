appProcessCheckFailed:
  en: "Setup could not check whether ${PRODUCT_NAME} is running.\n\nClose ${PRODUCT_NAME}, check that Windows PowerShell or the Windows tasklist tool is available, then click Retry. See the installation details for the detection error. Cancel to stop setup without continuing the installation."
  zh_CN: "安装程序无法检测 ${PRODUCT_NAME} 是否正在运行。\n\n请关闭 ${PRODUCT_NAME}，检查 Windows PowerShell 或 Windows 的 tasklist 工具是否可用，然后单击“重试”。具体检测错误请查看安装详细信息。单击“取消”可停止安装，不再继续安装过程。"
omgInstalling:
  en: "Installing..."
  zh_CN: "正在安装..."
omgPreparing:
  en: "Preparing installation..."
  zh_CN: "正在准备安装..."
omgExtracting:
  en: "Extracting application files..."
  zh_CN: "正在解压程序文件..."
omgCopying:
  en: "Copying application files..."
  zh_CN: "正在复制程序文件..."
omgFinalizing:
  en: "Finishing installation..."
  zh_CN: "正在完成安装..."
omgComplete:
  en: "Installation complete."
  zh_CN: "安装完成。"
appCannotBeClosed:
  en: "${PRODUCT_NAME} is still running, or its program files could not be updated.\n\nSetup did not finish. Your projects and conversations remain untouched.\n\nClose ${PRODUCT_NAME} and click Retry. If it still fails, Cancel, check security software or administrator permissions, and run the installer again. Rerunning the installer can repair incomplete program files."
  zh_CN: "${PRODUCT_NAME} 仍在运行，或程序文件无法更新。\n\n本次安装尚未完成。你的项目和会话数据不会被删除。\n\n请关闭 ${PRODUCT_NAME} 后单击“重试”。如果仍然失败，请取消安装，检查安全软件或管理员权限，然后重新运行安装程序；重新安装可以修复不完整的程序文件。"
