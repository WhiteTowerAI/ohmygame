<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src data: blob:; style-src 'unsafe-inline'; script-src 'nonce-ohmygame-scene-surface' blob:; font-src data:" />
    <script nonce="ohmygame-scene-surface">document.documentElement.style.colorScheme = new URLSearchParams(location.search).get("color-scheme") === "dark" ? "dark" : "light";</script>
    <style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}</style>
  </head>
  <body>
    <script nonce="ohmygame-scene-surface">
      (() => {
        const CHANNEL = "ohmygame:scene-surface";
        let activeInstanceId;
        let generation = 0;
        let moduleUrl;
        let sceneModule;
        let cleanup;

        function post(instanceId, type, payload = {}) {
          parent.postMessage({ channel: CHANNEL, instanceId, type, ...payload }, "*");
        }

        function readonlyGame(context) {
          const variables = Object.freeze({ ...(context?.variables || {}) });
          return Object.freeze({
            variables: Object.freeze({ get: (variable) => variables[variable] }),
          });
        }

        function renderArguments(data) {
          const emit = (action) => {
            post(data.instanceId, "action", { action });
          };
          return Object.freeze({
            node: Object.freeze({ ...(data.context?.node || {}) }),
            scene: Object.freeze({ ...(data.context?.scene || {}) }),
            game: readonlyGame(data.context),
            variables: Object.freeze({ ...(data.context?.variables || {}) }),
            actions: Object.freeze({
              continue: () => emit({ type: "continue" }),
              choose: (optionId) => {
                if (typeof optionId !== "string" || !optionId) throw new Error("actions.choose requires an option ID");
                emit({ type: "choose", optionId });
              },
              resolve: (result) => {
                if (typeof result !== "string" || !result) throw new Error("actions.resolve requires a result");
                emit({ type: "resolve", result });
              },
              restart: () => emit({ type: "restart" }),
              menu: () => emit({ type: "menu" }),
            }),
            mode: data.mode,
            root: document,
          });
        }

        async function render(data, initial) {
          const renderer = !initial && typeof sceneModule?.update === "function" ? sceneModule.update : sceneModule?.render;
          if (typeof renderer !== "function") throw new Error('scene.js must export a function named "render"');
          const result = await renderer(renderArguments(data));
          if (initial && typeof result === "function") cleanup = result;
        }

        window.addEventListener("message", async (message) => {
          const data = message.data;
          if (message.source !== parent || !data || data.channel !== CHANNEL || typeof data.instanceId !== "string" || (data.type !== "init" && data.type !== "update")) return;
          if (data.type === "update") {
            if (data.instanceId !== activeInstanceId || !sceneModule) return;
            try {
              await render(data, false);
            } catch (error) {
              post(data.instanceId, "error", { message: error instanceof Error ? error.message : String(error) });
            }
            return;
          }

          activeInstanceId = data.instanceId;
          const currentGeneration = ++generation;
          try { await cleanup?.(); } catch {}
          cleanup = undefined;
          sceneModule = undefined;
          if (moduleUrl) URL.revokeObjectURL(moduleUrl);
          document.body.innerHTML = data.files.html;
          document.getElementById("scene-surface-style")?.remove();
          const style = document.createElement("style");
          style.id = "scene-surface-style";
          style.textContent = data.files.css;
          document.head.append(style);
          try {
            moduleUrl = URL.createObjectURL(new Blob([data.files.javascript], { type: "text/javascript" }));
            const imported = await import(moduleUrl);
            if (currentGeneration !== generation) return;
            sceneModule = imported;
            await render(data, true);
            if (currentGeneration !== generation) return;
            document.documentElement.dataset.sceneSurfaceReady = "ready";
            post(data.instanceId, "ready");
          } catch (error) {
            if (currentGeneration === generation) post(data.instanceId, "error", { message: error instanceof Error ? error.message : String(error) });
          }
        });
      })();
    </script>
  </body>
</html>
